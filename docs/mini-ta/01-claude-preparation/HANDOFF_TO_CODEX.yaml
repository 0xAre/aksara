document_format:
  spec: docs/mini-ta/01-claude-preparation/16_DOCUMENT_FORMAT_SPEC.md
  authority: >
    Peraturan Direktur Poltek SSN tentang Pedoman Pelaksanaan Tugas Akhir
    (2024, 149 hlm), halaman 58-68. Berada DI LUAR repo:
    E:\Kuliah\TA\FINAL PERDIR PEDOMAN TA\. Ini peraturan resmi dan MENIMPA
    contoh docx manapun bila berbeda.
  cross_checked_with:
    - {file: "docs/mini-ta/00-template/Cetak TA_rev3.docx", result: "seluruh nilai tipografi hasil ukur XML COCOK dengan pedoman"}
    - {file: "docs/mini-ta/00-template/PROPOSAL CARAKA (2).docx", used_for: "identitas anggota dan preseden struktur ringkas mata kuliah yang sama"}
  page: "A4 HVS 80gr; margin kiri 4 cm, kanan/atas/bawah 3 cm"
  typography: "Times New Roman 12 pt, justify, spasi 1,15 (multiple at 1,15) - RESMI, bukan hasil terka. Paragraf TANPA indentasi"
  footer: "Auto text 'Politeknik Siber dan Sandi Negara', Arial 10 pt tebal, rata kanan, dari Abstrak sampai Daftar Pustaka"
  page_numbering: "Bagian awal angka Romawi kecil (tengah, 2,5 cm dari tepi bawah); bagian utama dan akhir angka Arab"
  heading_numbering: "Romawi.Arab - contoh IV.1 (subbab, KAPITAL) dan IV.1.1 (anak subbab, Title Case). BUKAN 2.1.1 angka Arab"
  figures_tables: "Nomor menyertakan nomor bab (Tabel 4.1). Judul tabel DI ATAS, judul gambar DI BAWAH, keduanya jarak 1,15 spasi, Title Case"
  citation_style: "IEEE numerik. Nomor dalam kurung siku SEBELUM tanda baca, dengan spasi sebelum kurung siku pembuka. Contoh: '... framework [1].'"
  simplified: true
  simplified_note: >
    Atas instruksi eksplisit pengguna 2026-07-27, STRUKTUR disederhanakan untuk
    konteks tugas mata kuliah - TATA TULIS tetap diikuti penuh sesuai pedoman.
    DIHAPUS: lembar judul duplikat, pernyataan orisinalitas, persetujuan,
    pengesahan penguji, persetujuan publikasi, kata pengantar, abstract bahasa
    Inggris, daftar notasi, daftar lampiran, daftar riwayat hidup, spesifikasi
    sampul hardcover/tinta emas/jilid lem, aturan bab mulai halaman ganjil.
    Seluruhnya artefak sidang TA resmi atau spesifikasi percetakan; tugas ini
    tidak melalui sidang dan tidak dijilid hardcover. DIPAKAI: sampul, Abstrak
    Indonesia, daftar isi/gambar/tabel, BAB I-VI, daftar pustaka.
    Abstrak NAIK dari opsional menjadi wajib - pedoman mengaturnya rinci dan ia
    jadi satu-satunya tempat pembaca menangkap koreksi klaim performa cepat.
  deviation_bab_count: >
    Pedoman hlm 64 menyebut Bagian Utama 5 bab. Dokumen ini memakai 6 bab
    (memisah Perancangan/Implementasi dari Pengujian/Analisis). BUKAN
    pelanggaran: contoh Cetak TA_rev3.docx yang lolos sidang juga 6 bab dengan
    pemisahan sama, dan isi AKSARA menuntutnya - implementasi sudah ada sebelum
    penelitian dimulai, pengujiannya yang baru dikerjakan.

restrictions:
  prohibited_claims:
    - "AKSARA aman secara absolut / tidak dapat diretas"
    - "AKSARA menggunakan tanda tangan digital Ed25519 secara aktif (TIDAK ADA sign/verify di source)"
    - "Forward secrecy / identity-hiding penuh / mutual authentication Noise_IK terverifikasi penuh (properti ini DOCUMENTED_ONLY, bukan CONFIRMED oleh test AKSARA sendiri)"
    - "Klaim timing Argon2id ~100ms sebagai fakta terukur (belum ada benchmark — DOCUMENTED_ONLY/LOW)"
    - "ChaCha20-Poly1305 aman terhadap nonce reuse (algoritma TIDAK misuse-resistant)"
    - "Replay protection tersedia (tidak ditemukan mekanisme replay-protection eksplisit)"
    - "snow (crate Noise) sudah diaudit keamanan formal (self-declared belum diaudit)"
    - "AKSARA selalu memverifikasi identitas peer tanpa kualifikasi (hanya berlaku untuk kontak yang sudah dikenal — trust-on-first-use pada kontak baru)"
    - "Angka hasil eksperimen apa pun di BAB V/VI sebelum EXP-01..05 benar-benar dijalankan"
  unresolved_information:
    - "Screenshot TUI aktual (build+fungsi terverifikasi SESSION 4, capture gambar tetap MANUAL_USER_ACTION_REQUIRED)"
    - "Apakah footer institusi dan Abstrak dua bahasa tetap diminta untuk tugas mata kuliah (kosmetik, lihat 16_DOCUMENT_FORMAT_SPEC.md §9)"
  claim_map: docs/mini-ta/01-claude-preparation/15_CLAIM_EVIDENCE_CITATION_MAP.md
  claim_map_critical_section: "§Klaim Kritis Anti-Overclaim (5 item prioritas tertinggi)"

