scope:
  main_problem: >
    Implementasi dan evaluasi protokol keamanan end-to-end AKSARA: pembentukan
    kanal aman dua-pihak via handshake Noise_IK (Noise_IK_25519_ChaChaPoly_BLAKE2s),
    bertumpu pada siklus hidup kunci kriptografi yang melindunginya, dievaluasi
    terhadap threat model proporsional untuk tugas mata kuliah.
  main_problem_source: docs/mini-ta/01-claude-preparation/09_SCOPE_AND_TEAM_PLAN.md §1
  research_questions:
    - "Bagaimana AKSARA mengimplementasikan Noise_IK untuk autentikasi identitas dan kerahasiaan sesi, dan properti mana yang benar-benar dapat diverifikasi dari evidence source-level?"
    - "Bagaimana siklus hidup kunci kriptografi AKSARA dikelola end-to-end, dan sejauh mana konsisten dengan standar terkait?"
    - "Sejauh mana desain protokol dan manajemen kunci AKSARA memberikan ketahanan terhadap kelas ancaman yang relevan, dan apa batasan/celah residual yang teridentifikasi?"
  research_questions_source: docs/mini-ta/01-claude-preparation/09_SCOPE_AND_TEAM_PLAN.md §2
  objectives_source: docs/mini-ta/01-claude-preparation/09_SCOPE_AND_TEAM_PLAN.md §3
  contribution_source: docs/mini-ta/01-claude-preparation/09_SCOPE_AND_TEAM_PLAN.md §4
  limitations_source: docs/mini-ta/01-claude-preparation/09_SCOPE_AND_TEAM_PLAN.md §5
  limitations_count: 9

