experiments:
  plan: docs/mini-ta/01-claude-preparation/12_TEST_PLAN.md
  result_template: docs/mini-ta/02-experiment-data/EXPERIMENT_RESULT_TEMPLATE.csv
  group_count: 5
  groups: [EXP-01 vault correctness/rejection, EXP-02 handshake Noise_IK, EXP-03 transport sesi, EXP-04 invite/fingerprint/contact store, EXP-05 benchmark Argon2id]
  results:
    - docs/mini-ta/02-experiment-data/EXPERIMENT_RESULTS_2026-07-26.csv
    - docs/mini-ta/02-experiment-data/EXPERIMENT_RESULTS_2026-07-27.csv
  result_status: EXECUTED
  result_status_note: >
    Seluruh 5 kelompok sudah dijalankan. 2026-07-26 (commit 3d22494):
    cargo test --release = 46/46 PASS, mencakup penuh correctness+rejection
    EXP-01..04. 2026-07-27 (commit 75d17fd): EXP-05 selesai (30 cold-start
    unseal, mean 47,99 ms neto / 68,47 ms end-to-end, sd 11,41/12,47 ms; vault
    108 byte pada 5 sampel) — MENGOREKSI klaim komentar kode "~100 ms"; EXP-04
    panjang invite 86 karakter pada 5 sampel; EXP-01 determinisme CLI 10/10 dan
    rejection passphrase salah 100%. DUA metrik tetap PARTIAL/BELUM terukur dan
    tidak boleh diklaim lebih: latensi handshake hanya batas atas < 0,86 ms
    (95% CI, n=19 — di bawah resolusi metode eksternal), overhead ciphertext
    instance Noise transport tidak diukur langsung, dan memory usage puncak
    (CM-154) tidak diukur. Pengukuran presisi ketiganya butuh instrumentasi
    src/ yang memerlukan permintaan eksplisit pengguna (AGENTS.md).
  environment: >
    Windows 11 Home 10.0.26200 build 26200; Intel Core i7-1165G7 4C/8T @2.80GHz;
    RAM 11.79 GB (free ~0.93 GB saat uji); bare-metal LENOVO 82FG; rustc 1.97.0
    (2d8144b78 2026-07-07) / cargo 1.97.0; profil --release. Seluruh angka
    performa berlaku HANYA untuk lingkungan ini — jangan digeneralisasi.

